<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>ATV 批次檔名</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* =========================================
   工單票卡・蓋章：每個檔案是一張工單票，選管別＝蓋上管別章
   ========================================= */

:root {
  --desk: #E9E2D3;
  --desk-line: #DDD4C1;
  --ticket: #FFFDF7;
  --ticket-edge: #D6CAB2;
  --ticket-rule: #E6DCC8;
  --ink: #2B2620;
  --ink-muted: #6B604F;
  --ink-faint: #9A8E7A;
  --stamp: #C0392B;
  --stamp-soft: #FBE9E6;
  --navy: #1F3A5F;
  --navy-hover: #162B47;
  --prod: #2F6FB0;
  --prod-soft: #E7F0FA;
  --equip: #2E7D55;
  --equip-soft: #E5F3EB;
  --pending: #B7791F;
  --pending-soft: #FBF1DD;
  --danger: #B42318;
  --danger-soft: #FDECEA;
  --radius: 6px;
  --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
  --shadow-ticket: 0 1px 0 rgba(43, 38, 32, 0.06), 0 6px 14px rgba(43, 38, 32, 0.07);

  /* 舊程式內仍有引用的變數 */
  --primary: var(--navy);
  --text-primary: var(--ink);
  --text-secondary: var(--ink-muted);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--desk);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, var(--desk-line) 31px 32px);
  color: var(--ink);
  font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
  line-height: 1.6;
  padding-bottom: 40px;
}

button,
input {
  font: inherit;
}

.main-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 20px 40px;
}

/* ---------- 頁首 ---------- */

.page-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px 24px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.page-hero__brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.hero-seal {
  width: 58px;
  height: 58px;
  flex-shrink: 0;
  border: 3px solid var(--stamp);
  border-radius: 50%;
  box-shadow: inset 0 0 0 3px var(--desk), inset 0 0 0 4.5px var(--stamp);
  color: var(--stamp);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  transform: rotate(-10deg);
}

.page-hero__title {
  font-size: 1.7rem;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.page-hero__sub {
  color: var(--ink-muted);
  font-size: 0.9rem;
}

.steps {
  display: flex;
  gap: 6px;
  list-style: none;
  flex-wrap: wrap;
}

.steps li {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px 5px 6px;
  background-color: var(--ticket);
  border: 1px solid var(--ticket-edge);
  border-radius: 999px;
  font-size: 0.82rem;
  color: var(--ink-muted);
}

.steps b {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background-color: var(--navy);
  color: #FFFFFF;
  font-size: 0.72rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.steps li.steps__stamp b {
  background-color: var(--stamp);
}

/* ---------- 投件口 ---------- */

.card {
  background-color: var(--ticket);
  border: 1px solid var(--ticket-edge);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-ticket);
}

.upload-area {
  border: 2px dashed var(--ticket-edge);
  border-radius: 8px;
  padding: 26px 20px;
  text-align: center;
  cursor: pointer;
  background-color: #FBF7EE;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

.upload-area:hover,
.upload-area:focus-visible {
  border-color: var(--navy);
  background-color: #F6F0E2;
  outline: none;
}

.upload-area__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 34px;
  margin-bottom: 8px;
  border: 2px solid var(--ink-muted);
  border-radius: 4px;
  color: var(--ink-muted);
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1;
  padding-left: 10px;
  position: relative;
}

/* 票根虛線 */
.upload-area__icon::after {
  content: "";
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 9px;
  border-left: 2px dashed var(--ink-faint);
}

.upload-area h3 {
  font-size: 1.05rem;
  color: var(--ink);
  margin-bottom: 4px;
}

.hint-text {
  color: var(--ink-muted);
  font-size: 0.85rem;
}

.hint-text strong {
  color: var(--ink);
}

/* ---------- 工單匣 ---------- */

.list-card__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.list-card__head h2 {
  font-size: 1.15rem;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.count-chip {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 999px;
  background-color: var(--ticket-rule);
  color: var(--ink-muted);
}

.count-chip--pending { background-color: var(--pending-soft); color: #8A5A12; }
.count-chip--production { background-color: var(--prod-soft); color: #1F548A; }
.count-chip--equipment { background-color: var(--equip-soft); color: #215F40; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px 16px;
  flex-wrap: wrap;
  padding: 10px 12px;
  margin-bottom: 14px;
  background-color: #F7F2E7;
  border: 1px solid var(--ticket-rule);
  border-radius: 8px;
}

.output-month-field {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-muted);
  font-size: 0.85rem;
}

.output-month-field label {
  color: var(--ink);
  font-weight: 700;
}

.output-month-field input {
  width: 160px;
  max-width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--ticket-edge);
  border-radius: var(--radius);
  background-color: #FFFFFF;
  color: var(--ink);
}

.output-month-field input:focus {
  outline: 2px solid var(--navy);
  outline-offset: 1px;
}

.output-month-field input:disabled {
  background-color: #EFEAE0;
  cursor: not-allowed;
}

.output-month-field__hint {
  font-size: 0.78rem;
}

.key-hints {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  color: var(--ink-muted);
  font-size: 0.78rem;
}

kbd {
  display: inline-block;
  min-width: 22px;
  padding: 0 5px;
  border: 1px solid var(--ticket-edge);
  border-bottom-width: 2px;
  border-radius: 4px;
  background-color: #FFFFFF;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.74rem;
  line-height: 1.5;
  text-align: center;
}

input[type="checkbox"] {
  accent-color: var(--navy);
}

.low-perf-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 16px 0 8px;
  cursor: pointer;
  color: var(--ink-muted);
  font-size: 0.82rem;
  line-height: 1.45;
}

.low-perf-label strong {
  color: var(--ink);
}

/* ---------- 分區標題（像檔案夾索引籤） ---------- */

.file-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.file-group-title {
  align-self: flex-start;
  font-size: 0.95rem;
  font-weight: 700;
  margin: 14px 0 0;
  padding: 4px 14px 4px 12px;
  border-radius: 6px 6px 0 0;
  border: 1px solid currentColor;
  border-bottom: 3px solid currentColor;
  letter-spacing: 0.04em;
}

.file-group-title:first-child {
  margin-top: 0;
}

.file-group-title--pending { color: #8A5A12; background-color: var(--pending-soft); }
.file-group-title--production { color: #1F548A; background-color: var(--prod-soft); }
.file-group-title--equipment { color: #215F40; background-color: var(--equip-soft); }

/* ---------- 工單票 ---------- */

.file-item {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 16px 12px 14px;
  background-color: var(--ticket);
  border: 1px solid var(--ticket-edge);
  border-left: 6px solid var(--ticket-edge);
  border-radius: 4px 8px 8px 4px;
  box-shadow: var(--shadow-ticket);
  cursor: default;
  transition: box-shadow 0.15s ease, transform 0.15s ease;
}

/* 右側票根缺口 */
.file-item::after {
  content: "";
  position: absolute;
  right: -9px;
  top: 50%;
  width: 16px;
  height: 16px;
  margin-top: -8px;
  border-radius: 50%;
  background-color: var(--desk);
  border: 1px solid var(--ticket-edge);
  clip-path: inset(0 50% 0 0);
}

.file-item:hover {
  box-shadow: 0 1px 0 rgba(43, 38, 32, 0.06), 0 10px 22px rgba(43, 38, 32, 0.11);
}

.file-item--pending { border-left-color: var(--pending); }
.file-item--production { border-left-color: var(--prod); }
.file-item--equipment { border-left-color: var(--equip); }

.file-item--pending:hover { border-left-color: #9A6414; }
.file-item--production:hover { border-left-color: #245A93; }
.file-item--equipment:hover { border-left-color: #22643F; }

.file-item--pending.file-item--pipe-selected,
.file-item--pending.file-item--pipe-selected:hover {
  border-left-color: var(--stamp);
}

.file-item--focused {
  outline: 2px solid var(--navy);
  outline-offset: 3px;
}

.file-item--pipe-required {
  outline: 3px solid var(--stamp);
  outline-offset: 3px;
  background-color: #FFF6F4;
}

.file-item--pipe-required .pipe-letter-row {
  padding: 6px;
  border-radius: 6px;
  background-color: var(--stamp-soft);
}

.ticket-no {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
  margin-bottom: 2px;
}

.ticket-type {
  font-family: inherit;
  letter-spacing: 0.02em;
  padding: 0 7px;
  border-radius: 3px;
  font-weight: 700;
}

.ticket-type--pending { color: #8A5A12; background-color: var(--pending-soft); }
.ticket-type--production { color: #1F548A; background-color: var(--prod-soft); }
.ticket-type--equipment { color: #215F40; background-color: var(--equip-soft); }

.file-info {
  flex: 1;
  min-width: 0;
}

.file-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
}

/* 管別章字鍵 */
.pipe-letter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.pipe-letter-label {
  color: var(--ink-muted);
  font-size: 0.76rem;
  margin-right: 2px;
}

.pipe-letter-btn,
.pipe-letter-input {
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1.5px solid var(--ticket-edge);
  border-radius: 5px;
  background-color: #FFFFFF;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: border-color 0.12s ease, color 0.12s ease, background-color 0.12s ease;
}

.pipe-letter-btn:hover {
  border-color: var(--stamp);
  color: var(--stamp);
}

.pipe-letter-btn--active {
  border-color: var(--stamp);
  background-color: var(--stamp);
  color: #FFFFFF;
}

.pipe-letter-btn--active:hover {
  color: #FFFFFF;
}

.pipe-letter-input {
  width: 46px;
  text-align: center;
  text-transform: uppercase;
  cursor: text;
  border-style: dashed;
  font-size: 0.78rem;
}

.pipe-letter-input:focus,
.file-name-input:focus,
.pipe-letter-btn:focus-visible {
  outline: 2px solid var(--navy);
  outline-offset: 1px;
}

/* 管別章 */
.file-row-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 72px;
}

.pipe-stamp {
  width: 64px;
  height: 64px;
  border: 3px solid var(--stamp);
  border-radius: 50%;
  box-shadow: inset 0 0 0 3px var(--ticket), inset 0 0 0 4.5px var(--stamp);
  color: var(--stamp);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transform: rotate(-12deg);
  opacity: 0.92;
  user-select: none;
}

.pipe-stamp__letter {
  font-family: var(--mono);
  font-size: 1.6rem;
  font-weight: 700;
}

.pipe-stamp__label {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  margin-top: 2px;
}

.pipe-stamp--empty {
  border: 2px dashed var(--ink-faint);
  box-shadow: none;
  color: var(--ink-faint);
  opacity: 1;
  transform: none;
}

.pipe-stamp--empty .pipe-stamp__letter {
  font-size: 0.82rem;
  font-family: inherit;
}

.pipe-stamp--pressed {
  animation: stamp-press 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.25);
}

@keyframes stamp-press {
  0% { transform: scale(1.7) rotate(-2deg); opacity: 0; }
  60% { transform: scale(0.9) rotate(-13deg); opacity: 1; }
  100% { transform: scale(1) rotate(-12deg); opacity: 0.92; }
}

/* 票根：狀態列 */
.file-status {
  flex: 0 0 calc(100% - 96px);
  margin-left: 96px;
  padding: 7px 10px 0;
  border-top: 1px dashed var(--ticket-edge);
  font-size: 0.88rem;
  font-weight: 600;
  line-height: 1.45;
  word-break: break-all;
  color: var(--ink-muted);
}

.file-status--pipe-missing { color: #8A5A12; }
.file-status--pipe-selected { color: var(--stamp); }
.file-status--production { color: #1F548A; }
.file-status--equipment,
.file-status--complete { color: #215F40; }
.file-status--processing { color: var(--pending); }
.file-status--waiting { color: var(--ink-faint); }
.file-status--error { color: var(--danger); }

.file-status span,
.file-status strong {
  color: inherit;
}

.file-status__filename {
  font-family: var(--mono);
  font-weight: 700;
  color: var(--ink) !important;
}

.file-status__note {
  font-weight: 400;
  font-size: 0.8rem;
  color: var(--pending) !important;
}

.status-badge {
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  background-color: var(--ticket-rule);
  color: var(--ink-muted);
}

.status-badge.completed { background-color: var(--equip-soft); color: #215F40; }
.status-badge.processing { background-color: var(--pending-soft); color: #8A5A12; }
.status-badge.error { background-color: var(--danger-soft); color: var(--danger); }

/* ---------- 縮圖與滑鼠預覽 ---------- */

.thumb-hover-wrap {
  position: relative;
  flex-shrink: 0;
  align-self: center;
  width: 80px;
  height: 100px;
}

.thumbnail-container {
  width: 100%;
  height: 100%;
  position: relative;
}

.thumbnail {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3px;
  cursor: zoom-in;
  border: 1px solid var(--ticket-edge);
  background-color: #F4EFE4;
  box-shadow: 2px 2px 0 var(--ticket-rule);
}

.thumb-hover-wrap:hover .thumbnail {
  border-color: var(--navy);
}

.thumb-hover-pop {
  display: block;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 400;
  max-width: min(520px, 72vw);
  max-height: min(88vh, 920px);
  padding: 8px;
  background-color: var(--ticket);
  border: 1px solid var(--ticket-edge);
  border-radius: 8px;
  box-shadow: 0 14px 34px rgba(43, 38, 32, 0.22);
}

.thumb-hover-pop img {
  display: block;
  max-width: min(500px, 70vw);
  max-height: min(84vh, 860px);
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 4px;
}

.thumb-hover-wrap:hover .thumb-hover-pop {
  visibility: visible;
  opacity: 1;
}

.thumb-hover-pop.preview-focus-top-left,
.thumb-hover-pop.preview-focus-top-right {
  width: min(500px, 70vw, calc((100vh - 24px) * 0.707));
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - 24px);
  aspect-ratio: 210 / 297;
  padding: 0;
  overflow: hidden;
}

.thumb-hover-pop.preview-focus-top-left img,
.thumb-hover-pop.preview-focus-top-right img {
  position: absolute;
  top: 0;
  width: 200%;
  height: 200%;
  max-width: none;
  max-height: none;
  object-fit: fill;
}

.thumb-hover-pop.preview-focus-top-left img { left: 0; }
.thumb-hover-pop.preview-focus-top-right img { right: 0; left: auto; }

/* ---------- 編輯檔名 ---------- */

.file-name-edit {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}

.file-name-input {
  flex: 1;
  min-width: 0;
  background-color: #FFFFFF;
  border: 1px solid var(--ticket-edge);
  border-radius: var(--radius);
  padding: 6px 10px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.85rem;
}

/* ---------- 按鈕 ---------- */

.btn,
.edit-btn {
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 10px 22px;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  background-color: var(--navy);
  color: #FFFFFF;
  transition: background-color 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
}

.btn:hover:not(:disabled),
.edit-btn:hover:not(:disabled) {
  background-color: var(--navy-hover);
  transform: translateY(-1px);
}

.btn:focus-visible,
.edit-btn:focus-visible {
  outline: 2px solid var(--navy);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn--sm,
.edit-btn {
  padding: 5px 12px;
  font-size: 0.78rem;
}

.btn--ghost,
.edit-btn--ghost {
  background-color: transparent;
  color: var(--ink-muted);
  border-color: var(--ticket-edge);
}

.btn--ghost:hover:not(:disabled),
.edit-btn--ghost:hover:not(:disabled) {
  background-color: #F3EDE1;
  color: var(--ink);
}

.btn--danger {
  background-color: transparent;
  color: var(--danger);
  border-color: #E8B4AE;
}

.btn--danger:hover:not(:disabled) {
  background-color: var(--danger-soft);
}

.btn--stamp {
  background-color: var(--stamp-soft);
  color: var(--stamp);
  border-color: #EBB5AE;
}

.btn--stamp:hover:not(:disabled) {
  background-color: #F7DAD5;
}

.btn--success {
  background-color: var(--equip);
}

.btn--success:hover:not(:disabled) {
  background-color: #22643F;
}

/* 操作列：檔案再多也固定在視窗底部 */
.actions {
  position: sticky;
  bottom: 0;
  z-index: 50;
  margin: 16px -20px -20px;
  padding: 12px 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  background-color: rgba(255, 253, 247, 0.97);
  border-top: 1px dashed var(--ticket-edge);
  border-radius: 0 0 10px 10px;
}

.actions .btn {
  flex: 1 1 140px;
}

.actions .btn--primary {
  flex: 2 1 200px;
}

/* ---------- 大圖預覽 ---------- */

.preview-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(43, 38, 32, 0.85);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.preview-modal.active {
  display: flex;
}

.preview-content {
  max-width: 90%;
  max-height: 90%;
  position: relative;
}

.preview-img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 6px;
  background-color: #FFFFFF;
}

.preview-close {
  position: absolute;
  top: -44px;
  right: 0;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background-color: var(--ticket);
  color: var(--ink);
  font-size: 1.3rem;
  cursor: pointer;
}

/* ---------- 進度面板 ---------- */

.batch-progress-panel {
  position: fixed;
  bottom: 86px;
  left: 50%;
  transform: translateX(-50%) translateY(160px);
  width: 90%;
  max-width: 520px;
  background-color: var(--ink);
  color: #F5F0E6;
  padding: 14px 20px;
  border-radius: 10px;
  box-shadow: 0 14px 30px rgba(43, 38, 32, 0.3);
  z-index: 100;
  transition: transform 0.3s ease;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.batch-progress-panel.active {
  transform: translateX(-50%) translateY(0);
}

.batch-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.88rem;
  font-weight: 600;
}

#batchCounter {
  font-family: var(--mono);
  color: #F2C9C3;
}

.batch-bar-bg {
  height: 6px;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  overflow: hidden;
}

.batch-bar-fill {
  height: 100%;
  width: 0%;
  transition: width 0.3s ease;
  background-color: var(--stamp);
}

/* ---------- 小螢幕 ---------- */

@media (max-width: 520px) {
  .main-container {
    padding: 18px 12px 32px;
  }

  .card {
    padding: 14px;
  }

  .actions {
    margin: 14px -14px -14px;
    padding: 10px 14px;
    flex-wrap: nowrap;
  }

  .actions .btn,
  .actions .btn--primary {
    flex: 1 1 0;
    min-width: 0;
    padding: 10px 8px;
  }

  .output-month-field label {
    white-space: nowrap;
  }

  .output-month-field__hint {
    display: none;
  }

  .file-item {
    flex-direction: column;
    padding-right: 92px;
  }

  .thumb-hover-wrap {
    align-self: flex-start;
  }

  .file-info {
    width: 100%;
    flex: none;
  }

  .file-row-actions {
    position: absolute;
    top: 12px;
    right: 12px;
  }

  .file-status {
    flex-basis: 100%;
    margin-left: 0;
    width: 100%;
  }

  .key-hints {
    display: none;
  }
}

/* 舊電腦或要求減少動態：關閉動畫與位移 */
body.legacy-win *,
body.legacy-win *::before,
body.legacy-win *::after {
  animation: none !important;
  transition: none !important;
}

body.legacy-win {
  background-image: none;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<div class="main-container">
  <header class="page-hero">
    <div class="page-hero__brand">
      <div class="hero-seal" aria-hidden="true">ATV</div>
      <div>
        <h1 class="page-hero__title">ATV 批次檔名</h1>
        <p class="page-hero__sub">每個檔案一張工單票，蓋上管別章就自動命名</p>
      </div>
    </div>
    <ol class="steps" aria-label="操作步驟">
      <li><b>1</b>放入檔案</li>
      <li class="steps__stamp"><b>2</b>蓋管別章</li>
      <li><b>3</b>開始辨識</li>
      <li><b>4</b>下載 ZIP</li>
    </ol>
  </header>

  <div class="card">
    <div class="upload-area" id="uploadArea" role="button" tabindex="0" aria-describedby="uploadHint">
      <div class="upload-area__icon" aria-hidden="true">+</div>
      <h3>點擊或拖曳檔案到這裡</h3>
      <p class="hint-text" id="uploadHint">支援 PDF 與圖片，可一次放入多個檔案</p>
      <input type="file" id="fileInput" accept="image/*,.pdf" multiple hidden>
    </div>
  </div>

  <div class="card" id="listCard" style="display: none;">
    <div class="list-card__head">
      <h2 id="fileCount">工單匣</h2>
      <button type="button" class="btn btn--sm btn--danger" onclick="App.clearAll()">清空</button>
    </div>

    <div class="toolbar">
      <div class="output-month-field">
        <label for="outputMonth">產出月份</label>
        <input type="month" id="outputMonth" inputmode="numeric" placeholder="YYYY-MM" aria-describedby="outputMonthHint">
        <span class="output-month-field__hint" id="outputMonthHint">檔名使用的年月</span>
      </div>
      <button type="button" class="btn btn--sm btn--stamp" id="btnApplyPipe" onclick="App.applyPipeToRest()" hidden></button>
      <div class="key-hints" aria-hidden="true">
        <kbd>↑</kbd><kbd>↓</kbd> 換票
        <kbd>A</kbd>～<kbd>Z</kbd> 蓋章
        <kbd>Enter</kbd> 開始
      </div>
    </div>

    <div class="file-list" id="fileListContainer"></div>

    <label class="low-perf-label" for="lowPerfMode">
      <input type="checkbox" id="lowPerfMode">
      <span><strong>低效能模式</strong>（記憶體少、易當機建議開啟；偵測到 <strong>Windows 7／NT 6.x</strong> 會自動使用 Win7 極限模式；非 Windows 11 會採較保守設定）</span>
    </label>
    <p class="hint-text">
      每張票都要先<strong>蓋管別章</strong>（點字母或直接按鍵盤字母，再按一次取消），再按<strong>「開始批次辨識」</strong>；程式會辨識報表類型並依管別產生檔名。
    </p>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="btnProcess" onclick="App.processAll()">開始批次辨識</button>
      <button type="button" class="btn btn--danger" id="btnCancel" onclick="App.cancelProcessing()" disabled style="display: none;">取消處理</button>
      <button type="button" class="btn btn--success" id="btnDownload" onclick="App.downloadAll()" disabled>下載全部</button>
    </div>
  </div>
</div>

<div class="batch-progress-panel" id="batchPanel" role="status" aria-live="polite">
  <div class="batch-info">
    <span id="batchStatusText">正在處理...</span>
    <span id="batchCounter">0 / 0</span>
  </div>
  <div class="batch-bar-bg">
    <div class="batch-bar-fill" id="batchBar"></div>
  </div>
</div>

<!-- 大圖預覽彈窗 -->
<div class="preview-modal" id="previewModal">
  <div class="preview-content">
    <button class="preview-close" onclick="App.closePreview()" aria-label="關閉預覽">×</button>
    <img class="preview-img" id="previewImg" src="" alt="預覽">
  </div>
</div>

<script src="helpers.js"></script>
<script src="app.js"></script>
</body>
</html>
