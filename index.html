<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>智能批次檔案管理系統 - 批量處理版</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* =========================================
   大瑞科技 (PMTC) 半導體企業風格
   ========================================= */

:root {
  --bg-color: #F0F2F5;
  --panel-bg: #FFFFFF;
  --text-main: #2C3E50;
  --text-muted: #4F5F6B;
  --brand-primary: #004080;
  --brand-hover: #003366;
  --brand-accent: #3498DB;
  --metal-gray: #BDC3C7;
  --border-radius: 6px;
  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);

  /* 對應原本程式內使用的變數名稱 */
  --primary: var(--brand-primary);
  --primary-dim: rgba(0, 64, 128, 0.08);
  --surface-0: var(--bg-color);
  --surface-1: var(--panel-bg);
  --surface-2: #F8FAFC;
  --text-primary: var(--text-main);
  --text-secondary: var(--text-muted);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  text-shadow: none !important;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: "Microsoft JhengHei", "Segoe UI", Tahoma, sans-serif;
  margin: 0;
  padding-bottom: 88px;
  line-height: 1.6;
}

body::before,
body::after {
  display: none !important;
}

.main-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 32px 20px 40px;
}

.page-hero {
  text-align: left;
  margin-bottom: 28px;
}

.page-hero__eyebrow {
  color: var(--text-muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.page-hero__eyebrow::before {
  content: "PMTC · ";
  color: var(--brand-primary);
}

.page-hero__title,
h1, h2, h3, .title {
  color: var(--brand-primary) !important;
  font-weight: 700;
  border-bottom: 2px solid var(--metal-gray);
  padding-bottom: 10px;
  margin-bottom: 14px;
  letter-spacing: 0.02em;
}

.page-hero__sub {
  color: var(--text-muted);
  font-size: 0.92rem;
}

.page-hero__line {
  display: none;
}

.card,
.panel {
  background-color: var(--panel-bg);
  border: 1px solid var(--metal-gray);
  border-radius: var(--border-radius);
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}

#listCard,
.file-list,
.file-item {
  overflow: visible;
}

.upload-area,
.drop-zone {
  background-color: var(--panel-bg);
  border: 2px dashed var(--metal-gray) !important;
  border-radius: var(--border-radius);
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.3s ease, background-color 0.3s ease;
}

.upload-area:hover,
.drop-zone:hover {
  border-color: var(--brand-primary) !important;
  background-color: #F8FAFC;
}

.upload-area h3 {
  color: var(--brand-primary);
  font-size: 1rem;
  border-bottom: none;
  margin-bottom: 6px;
  padding-bottom: 0;
}

.list-card__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.list-card__head h2 {
  font-size: 1.12rem;
  margin-bottom: 0;
}

.hint-text,
.low-perf-label {
  color: var(--text-muted);
  font-weight: 500;
}

.hint-text strong,
.low-perf-label strong {
  color: var(--brand-primary);
}

.low-perf-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 10px;
  cursor: pointer;
  font-size: 0.88rem;
  line-height: 1.45;
}

.output-month-field {
  display: flex;
  align-items: center;
  gap: 10px 12px;
  flex-wrap: wrap;
  margin: 14px 0 10px;
  padding: 12px 14px;
  background-color: #F8FAFC;
  border: 1px solid var(--metal-gray);
  border-radius: var(--border-radius);
  color: var(--text-muted);
  font-size: 0.88rem;
}

.output-month-field label {
  color: var(--brand-primary);
  font-weight: 700;
}

.output-month-field input {
  width: 170px;
  max-width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--metal-gray);
  border-radius: 4px;
  background-color: #FFFFFF;
  color: var(--text-main);
  font: inherit;
}

.output-month-field input:focus {
  outline: none;
  border-color: var(--brand-primary);
}

.output-month-field input:disabled {
  background-color: #E9ECEF;
  cursor: not-allowed;
}

.output-month-field__hint {
  flex: 1;
  min-width: 220px;
}

@media (max-width: 520px) {
  .output-month-field {
    align-items: stretch;
  }

  .output-month-field label,
  .output-month-field input,
  .output-month-field__hint {
    width: 100%;
    min-width: 0;
  }
}

input[type="checkbox"] {
  accent-color: var(--brand-primary);
}

.file-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.file-group-title {
  font-size: 1.05rem;
  font-weight: 700;
  margin: 18px 0 8px;
  padding: 9px 12px;
  border-left: 5px solid currentColor;
  border-radius: 4px;
}

.file-group-title:first-child {
  margin-top: 0;
}

.file-group-title--pending {
  color: #9A5200;
  background-color: #FFF4DE;
}

.file-group-title--production {
  color: #1455A3;
  background-color: #EAF3FF;
}

.file-group-title--equipment {
  color: #087A55;
  background-color: #E8F8F1;
}

.file-container,
.file-item {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 16px;
  background-color: var(--panel-bg);
  border: 1px solid var(--metal-gray) !important;
  border-left: 4px solid var(--brand-accent) !important;
  border-radius: var(--border-radius);
  margin-bottom: 10px;
  padding: 15px;
  box-shadow: var(--shadow-sm) !important;
}

.file-item:hover {
  border-left-color: var(--brand-primary) !important;
  background-color: #FBFCFD;
}

.file-item--pending {
  border-left-color: #E59A23 !important;
  background-color: #FFFCF5;
}

.file-item--production {
  border-left-color: #3B82C4 !important;
  background-color: #F7FBFF;
}

.file-item--equipment {
  border-left-color: #20A477 !important;
  background-color: #F5FCF9;
}

.file-item--pending:hover {
  border-left-color: #C87800 !important;
  background-color: #FFF9ED;
}

.file-item--production:hover {
  border-left-color: #1455A3 !important;
  background-color: #EFF7FF;
}

.file-item--equipment:hover {
  border-left-color: #087A55 !important;
  background-color: #EEFAF5;
}

.file-item--pending.file-item--pipe-selected,
.file-item--pending.file-item--pipe-selected:hover {
  border-left-color: #20A477 !important;
  background-color: #F0FBF6;
}

.file-item--pipe-selected .status-badge.pending {
  background-color: #20A477 !important;
}

.file-item--pipe-required {
  outline: 3px solid #D94841;
  outline-offset: 2px;
  background-color: #FFF2F0;
  box-shadow: 0 8px 22px rgba(217, 72, 65, 0.18) !important;
}

.file-item--pipe-required .pipe-letter-row {
  padding: 8px;
  border-radius: 4px;
  background-color: #FFF7F5;
  border: 1px solid #E7A19D;
}

.pipe-letter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 6px;
  margin-bottom: 8px;
}

.pipe-letter-label {
  color: #34495E;
  font-size: 0.72rem;
  margin-right: 2px;
  flex-shrink: 0;
}

.pipe-letter-btn,
.pipe-letter-input {
  min-width: 30px;
  padding: 5px 10px;
  font-size: 0.78rem;
  font-weight: 700;
  border-radius: 4px;
  border: 1px solid var(--metal-gray);
  background-color: #FFFFFF;
  color: var(--text-main);
  cursor: pointer;
  font-family: inherit;
  line-height: 1.2;
}

.pipe-letter-btn:hover {
  border-color: var(--brand-primary);
  color: var(--brand-primary);
}

.pipe-letter-btn--active {
  background-color: var(--brand-primary);
  border-color: var(--brand-primary);
  color: #FFFFFF;
}

.pipe-letter-input {
  width: 2.6rem;
  text-align: center;
  text-transform: uppercase;
  cursor: text;
  border-style: dashed;
}

.pipe-letter-input:focus,
.file-name-input:focus {
  outline: none;
  border-color: var(--brand-primary);
}

.file-info {
  flex: 1;
  min-width: 0;
}

.file-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
  color: var(--text-main);
}

.file-status {
  flex: 0 0 calc(100% - 96px);
  margin-left: 96px;
  margin-top: 6px;
  padding: 7px 10px;
  border-left: 4px solid currentColor;
  border-radius: 4px;
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.45;
  word-break: break-all;
}

.file-status--pipe-missing {
  color: #915000 !important;
  background-color: #FFF4DE;
}

.file-status--pipe-selected,
.file-status--equipment,
.file-status--complete {
  color: #087A55 !important;
  background-color: #E8F8F1;
}

.file-status--production {
  color: #1455A3 !important;
  background-color: #EAF3FF;
}

.file-status--error {
  color: #B42318 !important;
  background-color: #FFF0EE;
}

.file-status span,
.file-status strong {
  color: inherit !important;
}

.file-status__filename {
  font-weight: 700;
}

@media (max-width: 520px) {
  .file-item {
    flex-direction: column;
  }

  .thumb-hover-wrap {
    align-self: flex-start;
  }

  .file-info {
    width: 100%;
    flex: none;
  }

  .file-row-actions {
    position: absolute;
    top: 15px;
    right: 15px;
  }

  .file-status {
    flex-basis: 100%;
    margin-left: 0;
    width: 100%;
  }
}

.status-badge,
.badge {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: bold;
  background-color: var(--brand-accent) !important;
  color: #FFFFFF !important;
}

.status-badge.completed,
.status-ok {
  background-color: #27AE60 !important;
  color: #FFFFFF !important;
}

.status-badge.processing {
  background-color: #F39C12 !important;
  color: #FFFFFF !important;
}

.status-badge.error {
  background-color: #E74C3C !important;
  color: #FFFFFF !important;
}

.thumb-hover-wrap {
  position: relative;
  flex-shrink: 0;
  align-self: center;
  width: 80px;
  height: 100px;
}

.thumbnail-container {
  width: 100%;
  height: 100%;
  position: relative;
}

.thumbnail {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--border-radius);
  cursor: zoom-in;
  border: 1px solid var(--metal-gray);
  background-color: #F8FAFC;
}

.thumb-hover-wrap:hover .thumbnail {
  border-color: var(--brand-primary);
}

.thumb-hover-pop {
  display: block;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  position: fixed;
  right: auto;
  left: 0;
  top: 0;
  transform: none;
  z-index: 400;
  margin: 0;
  max-width: min(520px, 72vw);
  max-height: min(88vh, 920px);
  padding: 8px;
  background-color: var(--panel-bg);
  border: 1px solid var(--metal-gray);
  border-radius: var(--border-radius);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18) !important;
}

.thumb-hover-pop img {
  display: block;
  max-width: min(500px, 70vw);
  max-height: min(84vh, 860px);
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: var(--border-radius);
}

.thumb-hover-wrap:hover .thumb-hover-pop {
  visibility: visible;
  opacity: 1;
}

.thumb-hover-pop.preview-focus-top-left,
.thumb-hover-pop.preview-focus-top-right {
  width: min(500px, 70vw, calc((100vh - 24px) * 0.707));
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - 24px);
  aspect-ratio: 210 / 297;
  padding: 0;
  overflow: hidden;
}

.thumb-hover-pop.preview-focus-top-left img,
.thumb-hover-pop.preview-focus-top-right img {
  position: absolute;
  top: 0;
  width: 200%;
  height: 200%;
  max-width: none;
  max-height: none;
  object-fit: fill;
}

.thumb-hover-pop.preview-focus-top-left img {
  left: 0;
}

.thumb-hover-pop.preview-focus-top-right img {
  right: 0;
  left: auto;
}

.file-name-edit {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.file-name-input {
  flex: 1;
  background-color: #FFFFFF;
  border: 1px solid var(--metal-gray);
  border-radius: 4px;
  padding: 6px 10px;
  color: var(--text-main);
  font-size: 0.85rem;
}

button,
.btn,
.edit-btn {
  background-color: var(--brand-primary) !important;
  color: #FFFFFF !important;
  border: none !important;
  border-radius: 4px;
  padding: 10px 24px;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.2s ease;
}

button:hover:not(:disabled),
.btn:hover:not(:disabled),
.edit-btn:hover:not(:disabled) {
  background-color: var(--brand-hover) !important;
  transform: translateY(-1px);
}

button:disabled,
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

.btn--sm {
  padding: 8px 14px;
  font-size: 0.75rem;
}

.btn--danger,
.btn-danger,
.clear-btn {
  background-color: #E74C3C !important;
}

.btn--danger:hover:not(:disabled),
.btn-danger:hover,
.clear-btn:hover {
  background-color: #C0392B !important;
}

.btn--success {
  background-color: #27AE60 !important;
}

.btn--success:hover:not(:disabled) {
  background-color: #1E8449 !important;
}

.actions {
  margin-top: 22px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.preview-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(44, 62, 80, 0.88);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.preview-modal.active {
  display: flex;
}

.preview-content {
  max-width: 90%;
  max-height: 90%;
  position: relative;
}

.preview-img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
  border-radius: var(--border-radius);
  border: 1px solid var(--metal-gray);
  background-color: #FFFFFF;
}

.preview-close {
  position: absolute;
  top: -44px;
  right: 0;
  width: 38px;
  height: 38px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.batch-progress-panel {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  width: 90%;
  max-width: 560px;
  background-color: var(--panel-bg);
  border: 1px solid var(--metal-gray);
  padding: 16px 22px;
  border-radius: var(--border-radius);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.15) !important;
  z-index: 100;
  transition: transform 0.35s ease;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.batch-progress-panel.active {
  transform: translateX(-50%) translateY(0);
}

.batch-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-main);
}

#batchCounter {
  color: var(--brand-primary);
}

.batch-bar-bg {
  height: 7px;
  background: #E5E9EF;
  border-radius: 10px;
  overflow: hidden;
}

.batch-bar-fill {
  height: 100%;
  width: 0%;
  transition: width 0.3s ease;
  background-color: var(--brand-accent);
}
</style>
</head>
<body>

<div class="main-container">
  <header class="page-hero">
    <p class="page-hero__eyebrow">CYBER · OCR · BATCH</p>
    <h1 class="page-hero__title">ATV批次檔名</h1>
    <p class="page-hero__sub">大量處理版</p>
    <div class="page-hero__line" aria-hidden="true"></div>
  </header>

  <div class="card">
    <div class="upload-area" id="uploadArea">
      <h3>點擊或拖曳檔案至此 (支援 30+ 檔案)</h3>
      <p class="hint-text" style="margin-top: 10px;" id="uploadHint">建議單次勿超過過多檔案；程式會依效能模式限制筆數與單檔大小以防崩潰</p>
      <input type="file" id="fileInput" accept="image/*,.pdf" multiple hidden>
    </div>
  </div>

  <div class="card" id="listCard" style="display: none;">
    <div class="list-card__head">
      <h2 id="fileCount">檔案列表</h2>
      <button type="button" class="btn btn--sm btn--danger" onclick="App.clearAll()">清空</button>
    </div>
    <div class="file-list" id="fileListContainer"></div>

    <div class="output-month-field">
      <label for="outputMonth">產出月份</label>
      <input type="month" id="outputMonth" inputmode="numeric" placeholder="YYYY-MM" aria-describedby="outputMonthHint">
      <span class="output-month-field__hint" id="outputMonthHint">本次產生的檔名會使用此年月（例如 2026-08）。</span>
    </div>

    <label class="low-perf-label" for="lowPerfMode">
      <input type="checkbox" id="lowPerfMode">
      <span><strong>低效能模式</strong>（記憶體少、易當機建議開啟；偵測到 <strong>Windows 7／NT 6.x</strong> 會自動使用 Win7 極限模式；非 Windows 11 會採較保守設定）</span>
    </label>
    <p class="hint-text" style="margin: 0 0 8px; font-size: 0.82rem;">
      請先在<strong>各列「等待中」</strong>點選<strong>管別字母</strong>（可再點同一字母取消），再按<strong>「開始批次辨識」</strong>：程式只辨識報表類型並依選擇產生檔名；未選管別則檔名為「未辨識管」。
    </p>

    <div class="actions">
      <button type="button" class="btn" id="btnProcess" onclick="App.processAll()" style="flex: 2;">開始批次辨識</button>
      <button type="button" class="btn btn--danger" id="btnCancel" onclick="App.cancelProcessing()" disabled style="display: none; flex: 1;">取消處理</button>
      <button type="button" class="btn btn--success" id="btnDownload" onclick="App.downloadAll()" disabled style="flex: 1;">下載全部</button>
    </div>
  </div>
</div>

<div class="batch-progress-panel" id="batchPanel">
  <div class="batch-info">
    <span id="batchStatusText">正在處理...</span>
    <span id="batchCounter">0 / 0</span>
  </div>
  <div class="batch-bar-bg">
    <div class="batch-bar-fill" id="batchBar"></div>
  </div>
</div>

<!-- 大圖預覽彈窗 -->
<div class="preview-modal" id="previewModal">
  <div class="preview-content">
    <button class="preview-close" onclick="App.closePreview()">×</button>
    <img class="preview-img" id="previewImg" src="" alt="預覽">
  </div>
</div>

<script src="helpers.js"></script>
<script src="app.js"></script>
</body>
</html>
